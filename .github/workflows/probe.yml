name: probe
on: { workflow_dispatch: {} }

# Temporary: find which public trade feeds are reachable from a GitHub runner.
# stream.binance.com answers 451 (geo-blocked) even though it works from a laptop.

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install websockets
      - run: |
          python - <<'EOF'
          import asyncio, json, websockets

          CANDIDATES = [
            ("binance.com",     "wss://stream.binance.com:9443/ws/btcusdt@trade", None),
            ("binance.vision",  "wss://data-stream.binance.vision/ws/btcusdt@trade", None),
            ("binance.us",      "wss://stream.binance.us:9443/ws/btcusdt@trade", None),
            ("coinbase",        "wss://ws-feed.exchange.coinbase.com",
             {"type": "subscribe", "product_ids": ["BTC-USD"], "channels": ["matches"]}),
            ("kraken",          "wss://ws.kraken.com/v2",
             {"method": "subscribe", "params": {"channel": "trade", "symbol": ["BTC/USD"]}}),
            ("bitstamp",        "wss://ws.bitstamp.net",
             {"event": "bts:subscribe", "data": {"channel": "live_trades_btcusd"}}),
          ]

          async def probe(name, url, sub):
              try:
                  async with websockets.connect(url, open_timeout=15) as ws:
                      if sub:
                          await ws.send(json.dumps(sub))
                      for _ in range(6):          # skip acks, wait for real data
                          raw = await asyncio.wait_for(ws.recv(), timeout=20)
                          msg = json.loads(raw)
                          body = json.dumps(msg)
                          if any(k in body for k in ("trade_id", '"t":', '"id"', "trade")):
                              return f"OK    {name:16} {body[:150]}"
                      return f"NODATA {name:16} connected, no trade in 6 messages"
              except Exception as exc:
                  return f"FAIL  {name:16} {type(exc).__name__}: {str(exc)[:90]}"

          async def main():
              for line in await asyncio.gather(*(probe(*c) for c in CANDIDATES)):
                  print(line)

          asyncio.run(main())
          EOF
